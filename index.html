<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP - Academia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('cepimagem.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.5);
            background-blend-mode: darken;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(30, 30, 30, 0.9);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            width: 400px;
        }
        h2 { text-align: center; color: #ff9800; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #ccc; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .cep-group { display: flex; gap: 10px; align-items: flex-end; }
        .cep-group input { width: 70%; }
        .cep-group button { width: 30%; height: 35px; background: #ff9800; color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
        .cep-group button:hover { background: #e68900; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <h2>VENHA JÁ PARA A ACADEMIA</h2>
        
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Nome completo">

        <div class="cep-group">
            <div style="width: 70%;">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="Apenas números">
            </div>
            <button id="btnConsultar">Consultar</button>
        </div>

        <label for="logradouro">Logradouro:</label>
        <input type="text" id="logradouro" placeholder="Rua, Avenida...">

        <div class="row">
            <div class="col">
                <label for="numero">Nº:</label>
                <input type="text" id="numero">
            </div>
            <div class="col">
                <label for="complemento">Compl:</label>
                <input type="text" id="complemento">
            </div>
        </div>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro">

        <div class="row">
            <div class="col">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade">
            </div>
            <div class="col">
                <label for="estado">Estado:</label>
                <input type="text" id="estado">
            </div>
        </div>
    </div>

    <!-- Importa o script JavaScript -->
    <script src="script.js"></script>
</body>
</html>
